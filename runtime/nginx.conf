worker_processes auto;
pid /run/ppanel/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    map $http_x_forwarded_proto $forwarded_proto { default $scheme; http http; https https; }
    server {
        listen 8080;
        root /app/web/user;
        index index.html;
        absolute_redirect off;
        client_max_body_size 32m;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
        location ~ /\. { deny all; }
        location = /admin { return 308 /admin/$is_args$args; }
        location /admin/ {
            root /app/web;
            try_files $uri $uri/ /admin/index.html;
        }
        location ^~ /admin/static/ {
            root /app/web;
            try_files $uri =404;
        }
        location ^~ /admin/assets/ {
            root /app/web;
            try_files $uri =404;
        }
        location ^~ /static/ {
            root /app/web/user;
            try_files $uri =404;
        }
        location ^~ /assets/ {
            root /app/web/user;
            try_files $uri =404;
        }
        location ~ ^/v[12](?:/|$) {
            include /app/runtime/proxy.conf;
            proxy_pass http://127.0.0.1:8081;
        }
        # Optional custom subscription URL, generated from the runtime config.
        include /run/ppanel/subscribe*.conf;
        location / { try_files $uri $uri/ /index.html; }
    }
}
